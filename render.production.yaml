services:
  - type: web
    name: wyth-production
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NO_LOCAL_PROXY_FALLBACK
        value: "1"
      - key: APP_ORIGIN
        value: https://thewyth.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AUTH_RECOVERY_SECRET
        generateValue: true
