<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Wyth 视觉资产审核</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Microsoft YaHei", system-ui, sans-serif;
        background: #101316;
        color: #f4efe6;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #252a2e, #101316 55%); }
      header { padding: 28px 4vw 18px; display: flex; align-items: end; justify-content: space-between; gap: 24px; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(24px, 3vw, 44px); font-weight: 400; }
      p { margin: 7px 0 0; color: #aaa69f; }
      .status { padding: 8px 12px; border: 1px solid #4e4b46; border-radius: 999px; color: #d3c8b8; font-size: 13px; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding: 0 4vw 4vw; }
      figure { margin: 0; overflow: hidden; border: 1px solid #34383a; border-radius: 18px; background: #171b1e; box-shadow: 0 22px 60px #0008; }
      .frame { aspect-ratio: 16 / 9; display: grid; place-items: center; position: relative; background: linear-gradient(135deg, #1c2329, #17191b); }
      img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .missing { padding: 24px; color: #8e8c87; text-align: center; }
      figcaption { padding: 15px 18px 17px; display: flex; justify-content: space-between; gap: 16px; }
      strong { font-weight: 500; }
      small { color: #888680; }
      @media (max-width: 820px) { main { grid-template-columns: 1fr; } header { align-items: start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>Wyth visual review</h1><p>仅用于审核，图片通过前不会进入正式产品资源。</p></div>
      <div class="status" id="status">正在检查预览图片...</div>
    </header>
    <main>
      <figure>
        <div class="frame"><img data-preview src="scene-2.png?v=1" alt="场景 2 安静倾听者"><div class="missing" hidden>场景 2 尚未生成</div></div>
        <figcaption><strong>02 · 安静倾听者</strong><small>雨夜蓝灰 / 温暖灯光</small></figcaption>
      </figure>
      <figure>
        <div class="frame"><img data-preview src="scene-4.png?v=1" alt="场景 4 职场搭档"><div class="missing" hidden>场景 4 尚未生成</div></div>
        <figcaption><strong>04 · 职场搭档</strong><small>生活化工作室 / 城市黄昏</small></figcaption>
      </figure>
    </main>
    <script>
      const images = [...document.querySelectorAll('[data-preview]')];
      const status = document.querySelector('#status');
      let settled = 0;
      let loaded = 0;
      const finish = () => {
        settled += 1;
        if (settled === images.length) status.textContent = loaded === images.length ? '2 张图片已加载' : `已加载 ${loaded} / ${images.length} 张`;
      };
      images.forEach((image) => {
        image.addEventListener('load', () => { loaded += 1; finish(); });
        image.addEventListener('error', () => { image.hidden = true; image.nextElementSibling.hidden = false; finish(); });
      });
    </script>
  </body>
</html>
